name: testler

# Basak test paketi. Amac: "testler yesil mi" sorusunun cevabi artik
# yalniz Casper'in bilgisayarinda degil, her push'ta gorunur olsun.
#
# NEDEN TAM BAGIMLILIK SETI KURULUYOR (hafif liste yetmez):
#   tests/test_kapanis_db.py  -> import basak_app
#   basak_app.py              -> from voice import TTS, STT
#   voice/tts.py              -> piper, sounddevice, soundfile
#   voice/stt.py              -> faster_whisper, numpy
#   basak_app.py              -> import webview
# Yani testler masaustu ve ses katmanini da ice alir. Hafif bir liste
# kurulursa import hatasi verir; tam set kurulunca bagimlilik kaymasi
# (drift) de yakalanmis olur.
#
# pyannote.audio (torch) yalniz konusmaci tanimada tembel import edilir
# (voice/speaker_id.py); yine de gercek calisma bagimliligi oldugu icin
# listeden cikarilmaz.
#
# Not: yalniz `tests/` klasoru kosar. Kok dizindeki test_brain_cevapla.py
# ve test_tts_kontrol.py bilerek DISARIDA — onlar canli ag cagrisi yapar
# ve elle kosturulur (bkz. README "Elle kontroller").

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 2026-09-23: depo gizli oldu; gizli depoda Actions dakikasi bedava
# degil (Free plan: aylik 2.000 dk). Iki israf kesildi:
#   1) push her dala kosuyordu VE ayni is PR'da tekrar kosuyordu.
#      Artik push yalniz ana dalda; dallar PR uzerinden olculur.
#   2) Ust uste push'ta eski kosu bosuna devam ediyordu.
# Olculen taban (2026-09-23): kosu ortalamasi 3,3 dk, 29 saatte 20 kosu.
concurrency:
  group: testler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: windows-latest
    # Torch/ctranslate2 indirmesi nedeniyle comert tavan (olculen yerel
    # tam kosu: 28 sn; kurulum burada baskin kalem).
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Testleri kos
        env:
          # Sirlar CI'ya girmez: testler anahtarsiz da kosmali.
          # Gercek ag/kota kullanan testler tests/live/ altindadir ve
          # asagida haric tutulur (--live kapisi gerekir).
          PYTHONWARNINGS: ignore
        run: python -m pytest tests -q --ignore=tests/live


  provider-acceptance:
    name: gercek-provider-matrisi
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'preview/fatura-goz-cerrahi-20260927'
    needs: pytest
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ayni SHA kotasiz ozeti
        shell: pwsh
        run: |
          python -m pytest tests -q --ignore=tests/live 2>&1 | Tee-Object -FilePath full-pytest.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Gercek provider zincirini sina
        env:
          PYTHONPATH: ${{ github.workspace }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python tests/live/github_full_acceptance.py

      - name: Provider kabul raporunu artefakt yap
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-kabul-raporu
          path: github-full-acceptance.md
          if-no-files-found: warn
