name: Basak environment scope audit

on:
  push:
    branches:
      - basak-gate-deploy
    paths:
      - ".github/workflows/environment-scope-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Yalniz GitHub environment adlarini oku
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          url=f"https://api.github.com/repos/{os.environ['REPO']}/environments?per_page=100"
          req=urllib.request.Request(
              url,
              headers={
                  "Authorization": "Bearer "+os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  d=json.load(r)
              names=[x.get("name") for x in d.get("environments",[]) if x.get("name")]
              print("ENVIRONMENT_NAMES="+json.dumps(names,ensure_ascii=False))
          except urllib.error.HTTPError as e:
              print("ENVIRONMENT_API_HTTP="+str(e.code))
              raise
          PY
