name: Basak Gate schema sync

on:
  push:
    branches:
      - feature/basak-web-gate
    paths:
      - ".github/workflows/basak-gateway-schema-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/basak-web-gate
      - name: Gercek 52 arac semasini uret
        run: python basak_gateway/scripts/export_schemas.py basak_gateway/src/tool_schemas.json
      - name: Uretilen semayi dala yaz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add basak_gateway/src/tool_schemas.json
          if git diff --cached --quiet; then
            echo "Sema zaten guncel."
          else
            git commit -m "test(gate): 52 gercek arac semasini senkronla"
            git push origin HEAD:feature/basak-web-gate
          fi
