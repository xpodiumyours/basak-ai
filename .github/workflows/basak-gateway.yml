name: Basak Gate checks

on:
  push:
    branches:
      - feature/basak-web-gate
    paths:
      - "basak_gateway/**"
      - ".github/workflows/basak-gateway.yml"
  pull_request:
    paths:
      - "basak_gateway/**"
      - ".github/workflows/basak-gateway.yml"

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Web kaynaklarini kontrol et
        run: |
          npm --prefix basak_gateway run check
          npm --prefix basak_gateway test

      - name: 52 arac katalogu ve tam semalari gercek Basak kaynagiyla karsilastir
        run: python basak_gateway/scripts/check_catalog.py

      - name: Uretilen sema birebir ayni mi
        run: |
          python basak_gateway/scripts/export_schemas.py /tmp/tool_schemas.json
          cmp /tmp/tool_schemas.json basak_gateway/src/tool_schemas.json

      - name: Cloudflare Worker paketini yayinlamadan derle
        working-directory: basak_gateway
        run: npx --yes wrangler@4.68.0 deploy --dry-run --outdir /tmp/basak-gate-dist
