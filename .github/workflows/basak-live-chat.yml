name: Basak canli ajan sohbeti

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  basak-chat:
    if: >-
      github.event.issue.number == 4 &&
      github.event.comment.user.login == 'xpodiumyours' &&
      github.event.comment.body != 'FULL TEST'
    runs-on: windows-latest
    timeout-minutes: 12

    steps:
      - name: Basak kodunu al
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Canli ajan icin gerekli paketleri kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install openai==2.20.0 cohere==7.0.9 requests==2.32.5 ddgs==9.14.4

      - name: Gercek Basak sohbet hattini calistir
        env:
          PYTHONPATH: ${{ github.workspace }}
          BASAK_CHAT_MESSAGE: ${{ github.event.comment.body }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python tests/live/github_issue_chat.py

      - name: Cevabi issue'ya yaz
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'github-agent-result.md';
            let body = '### Başak canlı test\n\n❌ Test sonucu üretilemedi.';
            if (fs.existsSync(path)) {
              body = fs.readFileSync(path, 'utf8');
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 4,
              body
            });
