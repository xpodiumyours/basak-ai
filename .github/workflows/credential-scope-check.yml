name: Basak credential scope check

on:
  push:
    branches:
      - audit/exhaustive-8x52-20260919
    paths:
      - ".github/workflows/credential-scope-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Anahtar kapsamlarini deger olarak degil yalniz var/yok diye kontrol et
        shell: bash
        env:
          S_GROQ: ${{ secrets.GROQ_API_KEY }}
          V_GROQ: ${{ vars.GROQ_API_KEY }}
          S_GEMINI: ${{ secrets.GEMINI_API_KEY }}
          V_GEMINI: ${{ vars.GEMINI_API_KEY }}
          S_OPENROUTER: ${{ secrets.OPENROUTER_API_KEY }}
          V_OPENROUTER: ${{ vars.OPENROUTER_API_KEY }}
          S_ZAI: ${{ secrets.ZAI_API_KEY }}
          V_ZAI: ${{ vars.ZAI_API_KEY }}
          S_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          V_CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          S_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          V_CF_TOKEN: ${{ vars.CLOUDFLARE_API_TOKEN }}
          S_COHERE: ${{ secrets.COHERE_API_KEY }}
          V_COHERE: ${{ vars.COHERE_API_KEY }}
          S_KILO: ${{ secrets.KILO_API_KEY }}
          V_KILO: ${{ vars.KILO_API_KEY }}
          S_NVIDIA: ${{ secrets.NVIDIA_API_KEY }}
          V_NVIDIA: ${{ vars.NVIDIA_API_KEY }}
        run: |
          echo "### Basak credential scope" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Name | repository secret | repository variable |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          check () {
            local name="$1"
            local s="$2"
            local v="$3"
            if [ -n "$s" ]; then sp="VAR"; else sp="YOK"; fi
            if [ -n "$v" ]; then vp="VAR"; else vp="YOK"; fi
            echo "| $name | $sp | $vp |" >> "$GITHUB_STEP_SUMMARY"
          }
          check "GROQ_API_KEY" "$S_GROQ" "$V_GROQ"
          check "GEMINI_API_KEY" "$S_GEMINI" "$V_GEMINI"
          check "OPENROUTER_API_KEY" "$S_OPENROUTER" "$V_OPENROUTER"
          check "ZAI_API_KEY" "$S_ZAI" "$V_ZAI"
          check "CLOUDFLARE_ACCOUNT_ID" "$S_CF_ACCOUNT" "$V_CF_ACCOUNT"
          check "CLOUDFLARE_API_TOKEN" "$S_CF_TOKEN" "$V_CF_TOKEN"
          check "COHERE_API_KEY" "$S_COHERE" "$V_COHERE"
          check "KILO_API_KEY" "$S_KILO" "$V_KILO"
          check "NVIDIA_API_KEY" "$S_NVIDIA" "$V_NVIDIA"
