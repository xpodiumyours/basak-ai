name: Basak credential scope probe

on:
  push:
    branches:
      - basak-gate-deploy
    paths:
      - ".github/workflows/credential-scope-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      S_GROQ: ${{ secrets.GROQ_API_KEY }}
      V_GROQ: ${{ vars.GROQ_API_KEY }}
      S_GEMINI: ${{ secrets.GEMINI_API_KEY }}
      V_GEMINI: ${{ vars.GEMINI_API_KEY }}
      S_OPENROUTER: ${{ secrets.OPENROUTER_API_KEY }}
      V_OPENROUTER: ${{ vars.OPENROUTER_API_KEY }}
      S_ZAI: ${{ secrets.ZAI_API_KEY }}
      V_ZAI: ${{ vars.ZAI_API_KEY }}
      S_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      V_CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      S_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      V_CF_TOKEN: ${{ vars.CLOUDFLARE_API_TOKEN }}
      S_COHERE: ${{ secrets.COHERE_API_KEY }}
      V_COHERE: ${{ vars.COHERE_API_KEY }}
      S_KILO: ${{ secrets.KILO_API_KEY }}
      V_KILO: ${{ vars.KILO_API_KEY }}
      S_NVIDIA: ${{ secrets.NVIDIA_API_KEY }}
      V_NVIDIA: ${{ vars.NVIDIA_API_KEY }}
    steps:
      - name: Yalniz kapsam ve varlik sonucu
        shell: bash
        run: |
          python - <<'PY'
          import os
          rows = [
            ("GROQ_API_KEY","S_GROQ","V_GROQ"),
            ("GEMINI_API_KEY","S_GEMINI","V_GEMINI"),
            ("OPENROUTER_API_KEY","S_OPENROUTER","V_OPENROUTER"),
            ("ZAI_API_KEY","S_ZAI","V_ZAI"),
            ("CLOUDFLARE_ACCOUNT_ID","S_CF_ACCOUNT","V_CF_ACCOUNT"),
            ("CLOUDFLARE_API_TOKEN","S_CF_TOKEN","V_CF_TOKEN"),
            ("COHERE_API_KEY","S_COHERE","V_COHERE"),
            ("KILO_API_KEY","S_KILO","V_KILO"),
            ("NVIDIA_API_KEY","S_NVIDIA","V_NVIDIA"),
          ]
          for name,s,v in rows:
              print(f"{name}: secret={'YES' if os.environ.get(s) else 'NO'} variable={'YES' if os.environ.get(v) else 'NO'}")
          PY
