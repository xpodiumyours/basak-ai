name: Basak credential name audit

on:
  push:
    branches:
      - basak-gate-deploy
    paths:
      - ".github/workflows/credential-name-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Yalniz secret ve variable ADLARINI listele
        shell: bash
        env:
          ALL_SECRETS_JSON: ${{ toJson(secrets) }}
          ALL_VARS_JSON: ${{ toJson(vars) }}
        run: |
          python - <<'PY'
          import json, os
          secrets=json.loads(os.environ.get("ALL_SECRETS_JSON") or "{}")
          variables=json.loads(os.environ.get("ALL_VARS_JSON") or "{}")
          print("SECRET_NAMES=" + json.dumps(sorted(secrets.keys()), ensure_ascii=False))
          print("VARIABLE_NAMES=" + json.dumps(sorted(variables.keys()), ensure_ascii=False))
          PY
