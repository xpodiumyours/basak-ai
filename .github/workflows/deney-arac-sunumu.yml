name: Deney arac sunumu

# Olcum deneyi: araclar modele nasil sunulmali (CANLI / P2 / ADAY).
# Yalniz bu deney dosyalari degisip Claude dalina push edilince kosar;
# main, P1, P2 ve canliya dokunmaz. Gercek araclar CALISTIRILMAZ.
# Kota: saglayici basina cagri tavani tests/live/deney_arac_sunumu.py
# icinde (gemini 14, openrouter 24, digerleri 60); 429'da o saglayici durur.

on:
  push:
    branches: [claude/pensive-ptolemy-d669j4]
    paths:
      - tests/live/deney_arac_sunumu.py
      - .github/workflows/deney-arac-sunumu.yml

permissions:
  contents: read

jobs:
  deney:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Deneyi kos
        env:
          PYTHONPATH: ${{ github.workspace }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          python tests/live/deney_arac_sunumu.py
          cat deney-arac-sunumu.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deney-arac-sunumu
          path: |
            deney-arac-sunumu.md
            deney-arac-sunumu.json
