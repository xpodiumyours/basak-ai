<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Başak</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ana Uygulama -->
  <div class="app" id="terminalApp">

    <!-- Üst Bar -->
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <div class="logo-dot" id="brainDot"></div>
          <span class="logo-text">Başak</span>
        </div>
        <span class="header-status" id="sysStatus">hazırlanıyor...</span>
      </div>
      <div class="header-right">
        <button class="icon-btn" id="btnTts" title="Sesli okuma" aria-label="Sesli okuma">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/></svg>
        </button>
        <button class="icon-btn" id="btnClear" title="Hafızayı temizle" aria-label="Hafızayı temizle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14z"/></svg>
        </button>
        <button class="icon-btn" id="btnClose" title="Kapat" aria-label="Kapat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </header>

    <!-- Sohbet Alanı -->
    <main class="chat-area">
      <div class="chat-scroll" id="chatScroll">
        <div class="chat-empty" id="chatEmpty">
          <div class="welcome-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="48" height="48">
              <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z"/>
              <path d="M12 6a4 4 0 0 0-4 4c0 2 2 3 2 5h4c0-2 2-3 2-5a4 4 0 0 0-4-4z"/>
              <line x1="10" y1="17" x2="14" y2="17"/>
            </svg>
          </div>
          <h2>Merhaba, ben Başak</h2>
          <p>Size nasıl yardımcı olabilirim?</p>
        </div>
        <div class="messages" id="messages" role="log" aria-live="polite" aria-label="Sohbet"></div>
      </div>
    </main>

    <!-- Alt Kısım: Durum + Giriş -->
    <div class="input-area">
      <div class="status-bar" id="durumSatiri">BAŞAK HAZIR</div>
      <div class="composer">
        <button class="mic-btn" id="btnMic" aria-label="Mikrofonla konuş" title="Mikrofonla konuş" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/>
          </svg>
        </button>
        <textarea id="input" rows="1" placeholder="Bir şey sorun..." enterkeyhint="send"></textarea>
        <button class="send-btn" id="btnSend" title="Gönder" disabled aria-label="Gönder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <div class="composer-foot">
        <select id="modelSelect" class="model-select"></select>
        <span class="hint">ENTER gönderir</span>
      </div>
    </div>
  </div>

  <!-- Onay Modalı -->
  <div class="approval-overlay" id="approvalOverlay" style="display:none;">
    <div class="approval-card">
      <h3>⚠️ Onay Gerekli</h3>
      <div class="detail"><strong>İşlem:</strong> <span id="approvalTool">—</span></div>
      <div class="detail"><strong>Detay:</strong> <span id="approvalArgs">—</span></div>
      <div class="approval-actions">
        <button class="btn-reject" id="btnReject">İptal</button>
        <button class="btn-approve" id="btnApprove">Onayla</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
