<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAŞAK // JARVIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260910c">
</head>
<body>

  <!-- Boot Ekranı -->
  <div id="bootScreen" class="boot-screen">
    <div class="boot-orb">
      <div class="boot-core"></div>
      <div class="boot-ring"></div>
      <div class="boot-ring r2"></div>
      <div class="boot-ring r3"></div>
    </div>
    <div class="boot-text">
      <div class="boot-title">BAŞAK</div>
      <div class="boot-sub">JARVIS // SİSTEM BAŞLATILIYOR</div>
      <div class="boot-bar"><div class="boot-bar-fill"></div></div>
      <div class="boot-status" id="bootStatus">bağlanıyor...</div>
    </div>
  </div>

  <!-- Ana Uygulama -->
  <div class="app" id="terminalApp">

    <!-- Eski sohbetler cekmecesi (2026-09-10) -->
    <aside class="oturum-panel" id="oturumPanel" aria-label="Eski sohbetler">
      <div class="oturum-bas">
        <span>SOHBETLER</span>
        <button class="oturum-yeni" id="btnYeni" type="button">＋ Yeni</button>
      </div>
      <div class="oturum-liste" id="oturumListe"></div>
    </aside>

    <!-- 3D Orb Sahnesi -->
    <div class="orb-container" id="orbContainer">
      <canvas id="sahneCanvas"></canvas>
      <div class="orb-overlay">
        <div class="orb-label" id="orbLabel">BAŞAK BEKLEME MODU</div>
        <div class="orb-hint">hologram durum göstergesi</div>
      </div>
    </div>

    <!-- Üst Bar -->
    <header class="header">
      <div class="header-left">
        <button class="icon-btn" id="btnOturum" title="Eski sohbetler" aria-label="Eski sohbetler">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <div class="logo">
          <div class="logo-dot" id="brainDot"></div>
          <span class="logo-text">BAŞAK</span>
        </div>
        <span class="header-status" id="sysStatus">◆ sistem Bekleme Modu</span>
      </div>
      <div class="header-right">
        <button class="icon-btn" id="btnTts" title="Sesli okuma" aria-label="Sesli okuma">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/></svg>
        </button>
        <button class="icon-btn" id="btnClear" title="Hafızayı temizle" aria-label="Hafızayı temizle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14z"/></svg>
        </button>
        <button class="icon-btn" id="btnClose" title="Kapat" aria-label="Kapat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </header>

    <!-- Sohbet Alanı -->
    <main class="chat-area">
      <div class="chat-scroll" id="chatScroll">
        <div class="chat-empty" id="chatEmpty">
          <div class="welcome-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="48" height="48">
              <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z"/>
              <path d="M12 6a4 4 0 0 0-4 4c0 2 2 3 2 5h4c0-2 2-3 2-5a4 4 0 0 0-4-4z"/>
              <line x1="10" y1="17" x2="14" y2="17"/>
            </svg>
          </div>
          <h2>MERHABA, BEN BAŞAK</h2>
          <p>SİSTEM HAZIR. BİR ŞEY SORUN...</p>
          <div class="chips" id="chips">
            <button class="chip" type="button" data-soru="Bilgisayarımda dolaş bakalım neler görebiliyorsun">Bilgisayarda dolaş</button>
            <button class="chip" type="button" data-soru="Bekleyen görevlerim var mı">Görevlerim</button>
            <button class="chip" type="button" data-soru="Beni tanıyor musun">Beni tanıyor musun</button>
          </div>
        </div>
        <div class="messages" id="messages" role="log" aria-live="polite" aria-label="Sohbet"></div>
      </div>
    </main>

    <!-- Alt Kısım: Durum + Giriş -->
    <div class="input-area">
      <div class="status-bar" id="durumSatiri">BAŞAK HAZIR</div>
      <div class="composer">
        <button class="mic-btn" id="btnMic" aria-label="Mikrofonla konuş" title="Mikrofonla konuş" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/>
          </svg>
        </button>
        <textarea id="input" rows="1" placeholder="Mesajınız..." enterkeyhint="send"></textarea>
        <button class="send-btn" id="btnSend" title="Gönder" disabled aria-label="Gönder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <div class="composer-foot">
        <select id="modelSelect" class="model-select"></select>
        <span class="hint">ENTER gönderir</span>
      </div>
    </div>
  </div>

  <script src="three.min.js"></script>
  <script src="head.js?v=20260910c"></script>
  <script src="app.js?v=20260910c"></script>
</body>
</html>
