<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Başak Sohbet</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="shell">
  <header class="topbar">
    <div>
      <a href="/" class="brand">Başak</a>
      <div class="sub">Web sohbeti — aynı beyin, aynı araçlar</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <span class="pill"><span id="healthDot" class="dot"></span><span id="healthText">Kontrol</span></span>
      <a class="pill" href="/lab.html">Kabul matrisi</a>
    </div>
  </header>
  <div id="modelBar" class="modelbar" aria-live="polite"></div>
  <section class="card">
    <div id="chat" class="chat">
      <div class="bubble assistant">Başak web yüzü hazır. Mesajını yazabilirsin.<span class="meta">Aynı gerçek Başak çekirdeği ve araçları</span></div>
    </div>
    <div class="composer">
      <textarea id="message" maxlength="4000" placeholder="Başak'a yaz..."></textarea>
      <button id="send" class="action">Gönder</button>
    </div>
  </section>
</main>
<script src="/common.js"></script>
<script src="/app.js"></script>
</body>
</html>
