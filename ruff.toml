# Basak lint kapisi (2026-10-01, denetim Faz C) — bilerek MUHAFAZAKAR.
#
# NEDEN: kod tabani olgun ve buyuk; tum kurallari acmak ~1.400 gosterim
# uretir ki okunmez ve kimse bakmaz. Kapi once "gercek bozulmayi"
# yakalayan katmanla baslar: sozdizimi hatasi (E9), belirsiz ad (F8xx),
# belirsiz tanim (F63/F7), olumlu anahtar ve olumlu tanim tekrarlari
# (F601/F811). Bu kapi simdi YESIL ve CI her push'ta kosar.
#
# BILINCLI DISARIDAKILER — hepsi olcumle, tek tek gerekceli
# (kapatilan kodun bulgu sayisi: 122; bunlar ayri bir fazin isi):
#   E402 (36) — sys.path.insert SONRASI import kasitli: script ve
#               test dosyalarinda paket yolu once kurulmak zorunda.
#   E702 (19) — tek satirda noktali virgul; stil, behavior degistirmez.
#   E731 ( 7) — lambda atamasi; legacy stil.
#   F401 (42) — kullanilmayan importlarin bir kismi yan-etsiz import
#               (capability probe, kayit, modul kaydi); kontrolsuz
#               silme davranis degistirir — tek tek ele alinacak.
#   F541 ( 8) — f-string yer tutucusuz; zararsiz.
#   F841 (10) — kullanilmayan yerel degisken; bazilari niyetli
#               yakalama (sonucu bilerek atmak).
#
# Bu alti kural da gate'e alinmak istenirse once bulgular tek tek
# incelenip kapatilir, sonra ignore satiri daraltilir. Kural seti
# EXPLICIT yazildigi icin ruff surumu buyudukce varsayilanlar
# degistirse kapi ANLAMSIZCA genisleyip kirmiziya donmez.
target-version = "py310"

[lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E702", "E731", "F401", "F541", "F841"]
